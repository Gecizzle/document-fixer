<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document Fixer — Resize & Convert Images</title><style>body{font-family:system-ui;background:#0d1425;color:#f4f7ff;margin:0}main{max-width:640px;margin:6vh auto;padding:25px}h1{font-size:clamp(2rem,6vw,3.5rem);margin-bottom:10px}p{color:#b6c6dd}.panel{background:#19253b;border:1px solid #34455f;border-radius:18px;padding:25px}label{display:block;margin:16px 0 7px}input,select,button{box-sizing:border-box;width:100%;padding:13px;border-radius:9px;border:1px solid #71819c;font-size:16px}button{background:#69d8b2;color:#08152b;border:0;font-weight:800;cursor:pointer;margin-top:20px}button:disabled{opacity:.5}#result{margin-top:22px}a{color:#69d8b2}small{color:#a8b9ce}</style></head><body><main><h1>Fix your image in seconds.</h1><p>Convert JPG, PNG, or WebP. Resize and compress images without complicated software.</p><div class="panel"><form id="form"><label for="file">Choose image (up to 15 MB)</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp" required><label for="format">Output format</label><select id="format"><option value="jpeg">JPG</option><option value="png">PNG</option><option value="webp">WebP</option></select><label for="width">Maximum width in pixels (optional)</label><input id="width" type="number" min="0" max="8000" placeholder="e.g. 1200"><label for="quality">Quality (30–100)</label><input id="quality" type="number" min="30" max="100" value="80"><button id="go">Fix my image</button></form><div id="result" role="status"></div></div><p><small>Processed files are held temporarily for up to 20 minutes. Never upload sensitive documents to an untrusted service. PDF support is coming later.</small></p></main><script>
const form=document.getElementById('form'),result=document.getElementById('result'),go=document.getElementById('go');
form.onsubmit=async e=>{e.preventDefault();go.disabled=true;result.textContent='Processing...';try{const fd=new FormData();for(const id of ['file','format','width','quality'])fd.append(id,id==='file'?document.getElementById(id).files[0]:document.getElementById(id).value);const r=await fetch('/api/prepare',{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw Error(j.error);result.textContent='Ready: '+j.filename+' ('+Math.ceil(j.bytes/1024)+' KB). ';if(j.paymentEnabled){const b=document.createElement('button');b.textContent='Pay $2.99 & download';b.onclick=async()=>{b.disabled=true;try{const r=await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:j.id})});const x=await r.json();if(!r.ok)throw Error(x.error);location.href=x.url}catch(e){result.textContent=e.message}};result.append(b)}else{result.append('Downloads are disabled until payments are configured.')}}catch(e){result.textContent=e.message}finally{go.disabled=false}};
const q=new URLSearchParams(location.search);if(q.has('session_id')&&q.has('job')){result.textContent='Payment received? Click to verify and download.';const a=document.createElement('a');a.textContent=' Verify payment & download';a.href='/api/download/'+encodeURIComponent(q.get('job'))+'?session_id='+encodeURIComponent(q.get('session_id'));result.append(a)}
</script></body></html>
